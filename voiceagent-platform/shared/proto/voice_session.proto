syntax = "proto3";

package voiceagent.voice;

// Contract between telephony-gateway and voice-pipeline, and between
// voice-pipeline and agent-core. Kept in one shared file so both the
// Python services and orchestration-api (TypeScript) generate stubs
// from the same source of truth.

service VoicePipeline {
  rpc StreamCall(stream AudioFrame) returns (stream PipelineEvent);
}

message AudioFrame {
  string channel_id = 1;
  bytes pcm_16khz_mono = 2;
  int64 timestamp_ms = 3;
  // Generated by telephony-gateway at call start (see docs/adr/0006) and
  // threaded through every downstream service call unchanged, so a trace
  // collector can join VAD/STT/LLM-TTFT/TTS spans from different
  // services into one per-call timeline instead of four separate logs.
  string trace_id = 4;
}

message PipelineEvent {
  string channel_id = 1;
  string trace_id = 5;
  oneof event {
    PartialTranscript partial_transcript = 2;
    FinalTranscript final_transcript = 3;
    AudioFrame synthesized_audio = 4;
  }
}

message PartialTranscript {
  string text = 1;
  float confidence = 2;
}

message FinalTranscript {
  string text = 1;
  string language = 2;
}
