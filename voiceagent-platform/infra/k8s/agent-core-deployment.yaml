apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-core
  namespace: voiceagent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-core
  template:
    metadata:
      labels:
        app: agent-core
    spec:
      containers:
        - name: agent-core
          image: voiceagent/agent-core:latest
          ports:
            - containerPort: 50052
          envFrom:
            - secretRef:
                name: voiceagent-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # TCP-only readiness/liveness: a real deployment should
          # implement grpc.health.v1.Health in agent-core and switch this
          # to a `grpc:` probe (supported natively since k8s 1.24) for an
          # actual L7 health signal instead of "the port accepts a
          # connection."
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: agent-core
  namespace: voiceagent
spec:
  selector:
    app: agent-core
  ports:
    - port: 50052
      targetPort: 50052
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-core
  namespace: voiceagent
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: agent-core
