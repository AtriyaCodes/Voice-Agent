[project]
name = "agent-core"
version = "0.1.0"
description = "Dialogue management, LLM orchestration, and tool calling for VoiceAgent"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.63",
    "grpcio-tools>=1.63",
    "anthropic>=0.34",
    "redis>=5.0",
    "structlog>=24.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
